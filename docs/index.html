<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EndpointFeed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ms-blue:   #00a4ef;
      --ms-red:    #f25022;
      --ms-green:  #7fba00;
      --ms-yellow: #ffb900;
      --ms-blue-d:   #0090d4;
      --ms-red-d:    #d94018;
      --ms-green-d:  #6aa300;
      --ms-yellow-d: #e0a400;
    }

    /* ── DARK THEME ── */
    :root[data-theme="dark"] {
      --bg:         #111318;
      --bg-panel:   #17191f;
      --bg-card:    #1c1e26;
      --bg-header:  #0e1016;
      --bg-hover:   #22252e;
      --border:     #2c2f3a;
      --border-hi:  #3a3f4e;
      --text:       #dde1ea;
      --text-dim:   #8590a5;
      --text-mute:  #525a70;
      --accent:     #5b8dee;
      --accent-d:   #4a7bd4;
      --new-bg:     rgba(52,199,89,0.1);
      --new-fg:     #34c759;
      --new-border: rgba(52,199,89,0.28);
      --err-fg:     #ff6b6b;
      --err-border: rgba(255,107,107,0.3);
      --err-bg:     rgba(255,107,107,0.08);
      --live-color: #34c759;
      --shadow:     0 1px 8px rgba(0,0,0,0.45);
    }

    /* ── LIGHT THEME ── */
    :root[data-theme="light"] {
      --bg:         #f8f9fb;
      --bg-panel:   #ffffff;
      --bg-card:    #ffffff;
      --bg-header:  #f0f2f5;
      --bg-hover:   #f3f5f8;
      --border:     #d8dce6;
      --border-hi:  #bcc2ce;
      --text:       #1a1d26;
      --text-dim:   #46505f;
      --text-mute:  #8892a4;
      --accent:     #2563eb;
      --accent-d:   #1d4ed8;
      --new-bg:     rgba(22,163,74,0.08);
      --new-fg:     #16a34a;
      --new-border: rgba(22,163,74,0.28);
      --err-fg:     #dc2626;
      --err-border: rgba(220,38,38,0.3);
      --err-bg:     rgba(220,38,38,0.07);
      --live-color: #16a34a;
      --shadow:     0 1px 4px rgba(0,0,0,0.09);
    }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      line-height: 1.55;
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    /* ── HEADER ── */
    header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 54px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 200;
      box-shadow: var(--shadow);
    }

    .header-right { display: flex; align-items: center; gap: 10px; }

    #last-updated {
      font-size: 12px;
      color: var(--text-mute);
      font-family: 'JetBrains Mono', monospace;
    }
    #last-updated b { color: var(--ms-green); }

    .btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }

    #theme-btn {
      width: 32px; height: 30px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      transition: border-color 0.15s;
      flex-shrink: 0;
    }
    #theme-btn:hover { border-color: var(--accent); }

    /* Microsoft color stripe under header */
    .ms-stripe {
      height: 2px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      opacity: 0.65;
    }
    .ms-stripe div:nth-child(1) { background: var(--ms-blue); }
    .ms-stripe div:nth-child(2) { background: var(--ms-red); }
    .ms-stripe div:nth-child(3) { background: var(--ms-green); }
    .ms-stripe div:nth-child(4) { background: var(--ms-yellow); }

    /* ── TOOLBAR ── */
    .toolbar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      position: sticky; top: 57px; z-index: 100;
    }

    .cat-pill {
      display: flex; align-items: center; gap: 5px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-mute);
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .cat-pill .pip {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .cat-pill:hover {
      border-color: var(--accent);
      color: var(--text);
      background: var(--bg-hover);
    }

    .toolbar-divider {
      width: 1px; height: 20px;
      background: var(--border);
      margin: 0 2px; flex-shrink: 0;
    }

    .search-wrap { position: relative; margin-left: auto; }
    .search-wrap::before {
      content: '🔍';
      position: absolute; left: 9px; top: 50%;
      transform: translateY(-50%);
      font-size: 11px; pointer-events: none;
      opacity: 0.4;
    }
    #search {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      padding: 5px 12px 5px 28px;
      border-radius: 4px;
      width: 230px; outline: none;
      transition: border-color 0.15s;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--text-mute); }

    /* ── STATUS BAR ── */
    .statusbar {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      padding: 5px 20px;
      display: flex; gap: 0; align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-mute);
      overflow-x: auto;
    }

    .sb-seg {
      display: flex; align-items: center; gap: 6px;
      padding-right: 16px; margin-right: 16px;
      border-right: 1px solid var(--border);
      white-space: nowrap;
    }
    .sb-seg:last-child { border-right: none; }
    .sb-seg b { color: var(--text); font-weight: 600; }

    .live-dot {
      width: 7px; height: 7px;
      background: var(--live-color);
      border-radius: 50%;
      animation: livepulse 2s ease infinite;
      flex-shrink: 0;
    }
    @keyframes livepulse {
      0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(127,186,0,0.5); }
      50%      { opacity:0.7; box-shadow: 0 0 0 4px rgba(127,186,0,0); }
    }

    /* ── MAIN ── */
    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 14px 20px 60px;
      display: flex; flex-direction: column; gap: 6px;
    }

    /* ── CATEGORY SECTION ── */
    .cat-section {
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .cat-section:hover { border-color: var(--border-hi); }

    .cat-header {
      display: flex; align-items: stretch;
      height: 44px;
      background: var(--bg-panel);
      cursor: pointer; user-select: none;
      transition: background 0.12s;
      border-bottom: 1px solid transparent;
    }
    .cat-header:hover { background: var(--bg-hover); }
    .cat-section.open .cat-header { border-bottom-color: var(--border); }

    .cat-color-bar {
      width: 4px; flex-shrink: 0;
    }

    .cat-header-inner {
      flex: 1;
      display: flex; align-items: center;
      padding: 0 14px; gap: 12px;
    }

    .cat-icon {
      font-size: 15px;
      flex-shrink: 0;
      width: 20px;
      text-align: center;
    }

    .cat-name {
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.3px;
      color: var(--text);
      flex: 1;
    }

    .cat-meta {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px;
      color: var(--text-mute);
      font-family: 'Barlow', sans-serif;
    }
    .cat-pill-count {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 1px 8px;
      border-radius: 2px;
      font-size: 11px;
    }
    .cat-err-tag {
      color: var(--ms-red);
      font-size: 11px;
    }
    .cat-chevron {
      color: var(--text-mute);
      font-size: 10px;
      transition: transform 0.2s;
    }
    .cat-section.open .cat-chevron { transform: rotate(90deg); }

    .cat-body {
      display: none;
      padding: 12px;
      background: var(--bg);
    }
    .cat-section.open .cat-body { display: block; }

    /* ── FEED GRID ── */
    .feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 10px;
    }

    /* ── FEED CARD ── */
    .feed-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex; flex-direction: column;
      animation: cardIn 0.25s ease forwards;
      opacity: 0;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(5px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .card-header {
      padding: 8px 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .card-color-dot {
      width: 8px; height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .card-name {
      font-weight: 600;
      font-size: 12px;
      color: var(--text);
      flex: 1;
      font-family: 'Barlow', sans-serif;
    }
    .card-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-mute);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0 6px;
      border-radius: 2px;
    }
    .card-err-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--err-fg);
      background: var(--err-bg);
      border: 1px solid var(--err-border);
      padding: 0 6px;
      border-radius: 2px;
    }

    /* ── ARTICLE ── */
    .article {
      display: block; text-decoration: none; color: inherit;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .article:last-child { border-bottom: none; }
    .article:hover { background: var(--bg-hover); }
    .article:hover .art-title { color: var(--accent); }

    .art-meta {
      display: flex; align-items: center; gap: 7px;
      margin-bottom: 4px; flex-wrap: wrap;
    }
    .art-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-mute);
    }
    .art-author {
      font-size: 11px;
      color: var(--text-mute);
    }
    .art-author::before { content: '·'; margin-right: 5px; color: var(--border-hi); }

    .badge-new {
      font-family: 'Barlow', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.3px;
      background: var(--new-bg);
      color: var(--new-fg);
      border: 1px solid var(--new-border);
      padding: 0 5px;
      border-radius: 3px;
    }

    .art-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.45;
      margin-bottom: 4px;
      transition: color 0.1s;
    }
    .art-summary {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .art-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .art-tag {
      font-size: 11px;
      color: var(--text-dim);
      background: var(--bg-hover);
      border: 1px solid var(--border);
      padding: 1px 7px;
      border-radius: 12px;
      font-family: 'Barlow', sans-serif;
    }

    .feed-error {
      padding: 12px;
      font-size: 12px;
      color: var(--err-fg);
      font-style: italic;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── MEDIA ── */
    /* YouTube items inside feed cards */
    .yt-item {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      text-decoration: none; color: inherit;
      transition: background 0.1s;
    }
    .yt-item:last-child { border-bottom: none; }
    .yt-item:hover { background: var(--bg-hover); }
    .yt-item:hover .yt-item-title { color: var(--ms-red); }
    /* keep red for YouTube — it's the YouTube brand color */

    .yt-thumb-sm {
      flex-shrink: 0;
      width: 100px; height: 56px;
      background: var(--bg-panel);
      border-radius: 3px; overflow: hidden;
      position: relative;
    }
    .yt-thumb-sm img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .yt-thumb-sm-play {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.35);
      opacity: 0; transition: opacity 0.1s;
    }
    .yt-item:hover .yt-thumb-sm-play { opacity: 1; }
    .yt-play-sm {
      width: 22px; height: 22px;
      background: var(--ms-red);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; padding-left: 2px; color: #fff;
    }
    .yt-item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .yt-item-title {
      font-size: 12px; font-weight: 500; color: var(--text);
      line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      transition: color 0.1s;
    }
    .yt-item-meta { font-size: 10px; color: var(--text-mute); font-family: 'JetBrains Mono', monospace; display: flex; gap: 7px; }

    /* Podcast items inside feed cards */
    .pod-item {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 5px;
    }
    .pod-item:last-child { border-bottom: none; }
    .pod-item-title {
      font-size: 12px; font-weight: 500; color: var(--text);
      line-height: 1.4; text-decoration: none;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      transition: color 0.1s;
    }
    .pod-item-title:hover { color: var(--accent); }
    .pod-item-meta { font-size: 10px; color: var(--text-mute); font-family: 'JetBrains Mono', monospace; display: flex; gap: 8px; align-items: center; }
    .pod-item-player audio { width: 100%; height: 26px; margin-top: 4px; outline: none; }
    [data-theme="dark"] .pod-item-player audio { filter: invert(1) hue-rotate(180deg) brightness(0.75); }
    .pod-no-audio { font-size: 11px; color: var(--text-mute); font-style: italic; }


    /* Card grid (Articles / New) */

    .new-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
    }
    .new-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex; flex-direction: column;
      text-decoration: none; color: inherit;
      transition: background 0.1s, border-color 0.15s;
      animation: cardIn 0.25s ease forwards; opacity: 0;
    }
    .new-card:hover { background: var(--bg-hover); border-color: var(--border-hi); }
    .new-card:hover .new-card-title { color: var(--accent); }

    .new-card-top {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px 8px;
    }
    .new-card-source {
      font-size: 12px; color: var(--text);
      font-weight: 600; letter-spacing: 0.01em;
      flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .new-card-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--text-mute); white-space: nowrap;
    }
    .mvp-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
      padding: 2px 5px; border-radius: 3px; flex-shrink: 0;
      background: #0078d4; color: #fff; white-space: nowrap;
    }
    .new-card-thumb {
      width: 100%; aspect-ratio: 16/9;
      object-fit: cover; display: block;
    }
    .new-card-body {
      padding: 10px 14px 12px;
      display: flex; flex-direction: column; gap: 6px; flex: 1;
    }
    .new-card-title {
      font-size: 14px; font-weight: 500; color: var(--text);
      line-height: 1.45; transition: color 0.1s;
    }
    .new-card-summary {
      font-size: 13px; color: var(--text-dim); line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    @media (max-width: 680px) { .new-card-grid { grid-template-columns: 1fr; } }

    /* Day-range selector in toolbar */
    .day-range-pill {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-mute);
      font-family: 'Barlow', sans-serif;
      font-size: 12px; font-weight: 600;
      padding: 4px 10px; border-radius: 4px;
      cursor: pointer; transition: all 0.12s;
      white-space: nowrap;
    }
    .day-range-pill:hover { border-color: var(--accent); color: var(--accent); }
    .day-range-pill.active { border-color: var(--accent); color: var(--accent); background: rgba(91,141,238,0.1); }
    /* ── VENDOR BADGE ── */
    .vendor-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 0.05em;
      padding: 2px 6px; border-radius: 3px; flex-shrink: 0;
      border: 1px solid; white-space: nowrap;
    }

    /* ── LOADING ── */
    #loading {
      padding: 70px 0; text-align: center; color: var(--text-mute);
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--ms-blue);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

    /* Sources view */
    #sources-view { padding-bottom: 40px; }
    .sources-heading {
      font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--text-mute);
      margin: 28px 0 12px; display: flex; align-items: center; gap: 8px;
    }
    .sources-heading-dot {
      display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    }
    .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── FOOTER ── */
    footer {
      background: var(--bg-header);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: var(--text-mute);
      font-family: 'JetBrains Mono', monospace;
    }
    .footer-brand {
      display: flex; align-items: center; gap: 8px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 680px) {
      .feed-grid { grid-template-columns: 1fr; }
      .search-wrap { margin-left: 0; width: 100%; order: 99; flex-basis: 100%; }
      #search { width: 100%; }
      header, .toolbar, .statusbar, .container, footer { padding-left: 12px; padding-right: 12px; }
      #last-updated { display: none; }
    }

    .new-feed-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      animation: cardIn 0.25s ease forwards;
      opacity: 0;
    }
    .new-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      text-decoration: none; color: inherit;
      transition: background 0.1s;
    }
    .new-item:last-child { border-bottom: none; }
    .new-item:hover { background: var(--bg-hover); }
    .new-item:hover .new-item-title { color: var(--accent); }
    .new-cat-tag {
      flex-shrink: 0;
      font-family: 'Barlow', sans-serif;
      font-size: 10px; font-weight: 600; letter-spacing: 0.2px;
      padding: 2px 8px; border-radius: 3px; border: 1px solid;
      white-space: nowrap;
    }
    .new-item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  </style>
</head>
<body>

<header>
  <div class="header-left" style="font-family:'Barlow',sans-serif;font-weight:700;font-size:18px;letter-spacing:0.5px;color:var(--text)">Endpoint<span style="color:var(--accent)">Feed</span></div>
  <div class="header-right">
    <div id="last-updated">initializing…</div>
    <button class="btn" id="sources-btn" onclick="showSources()">Sources</button>
    <button class="btn" onclick="loadFeeds()">↺ refresh</button>
    <button class="btn" id="expand-btn" onclick="toggleAll()">+ expand all</button>
    <button id="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
  </div>
</header>

<!-- Microsoft 4-color stripe -->
<div class="ms-stripe">
  <div></div><div></div><div></div><div></div>
</div>

<div class="toolbar" id="toolbar">
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search articles…" oninput="handleSearch()" />
  </div>
</div>

<div class="statusbar">
  <div class="sb-seg"><span class="live-dot"></span><b>LIVE</b></div>
  <div class="sb-seg">articles: <b id="stat-total">—</b></div>
  <div class="sb-seg">sources: <b id="stat-sources">—</b></div>
  <div class="sb-seg">updated: <b id="stat-updated">—</b></div>
</div>

<div class="container">
  <div id="loading">
    <div class="spinner"></div>
    <div class="load-text">loading feeds…</div>
  </div>
  <div id="cats" style="display:contents"></div>
  <div id="sources-view" style="display:none"></div>
</div>

<footer>
  <div class="footer-brand">EndpointFeed</div>
  <span id="footer-ts"></span>
</footer>

<script>
/* ── Media categories (Video + Audio only) ───────────────── */
const CATEGORIES = [
  { id:'video', label:'Video',           color:'#f25022' },
  { id:'audio', label:'Podcasts / Audio', color:'#00a4ef' },
];

const ARTICLES_CAT = { id: 'articles', label: 'Blog Posts',  color: '#5b8dee' };
const VENDOR_CAT   = { id: 'vendor',   label: 'Official',    color: '#7fba00' };

const VENDORS = [
  { id: 'microsoft', label: 'Microsoft',       color: '#0078d4' },
  { id: 'nerdio',    label: 'Nerdio',           color: '#6c4bf4' },
  { id: 'recast',    label: 'Recast Software',  color: '#e55a1c' },
];

let allFeeds = [];
let openSet  = new Set(['articles', 'video', 'audio', 'vendor']);
let allOpen  = false;
let newDays  = 7;

/* ── Theme ──────────────────────────────────────────────── */
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.dataset.theme === 'dark';
  html.dataset.theme = isDark ? 'light' : 'dark';
  document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
  try { localStorage.setItem('ef-theme', html.dataset.theme); } catch(_){}
}
try {
  const saved = localStorage.getItem('ef-theme');
  if (saved) {
    document.documentElement.dataset.theme = saved;
    document.getElementById('theme-btn').textContent = saved === 'dark' ? '🌙' : '☀️';
  }
} catch(_){}

/* ── Toolbar ────────────────────────────────────────────── */
function buildToolbar() {
  const bar = document.getElementById('toolbar');
  bar.querySelectorAll('.cat-pill, .toolbar-divider, .day-range-pill').forEach(e => e.remove());
  const sw = bar.querySelector('.search-wrap');

  bar.insertBefore(makePill(VENDOR_CAT.label, VENDOR_CAT.color, VENDOR_CAT.id), sw);
  bar.insertBefore(makePill(ARTICLES_CAT.label, ARTICLES_CAT.color, ARTICLES_CAT.id), sw);
  CATEGORIES.forEach(cat => bar.insertBefore(makePill(cat.label, cat.color, cat.id), sw));
  bar.insertBefore(makeDivider(), sw);
  [1, 7, 14, 30].forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day-range-pill' + (d === newDays ? ' active' : '');
    btn.textContent = d + 'd';
    btn.dataset.days = d;
    btn.onclick = () => {
      newDays = d;
      bar.querySelectorAll('.day-range-pill').forEach(b => b.classList.toggle('active', +b.dataset.days === d));
      renderAll(document.getElementById('search').value.toLowerCase().trim());
    };
    bar.insertBefore(btn, sw);
  });
}

function makePill(label, color, catId) {
  const btn = document.createElement('button');
  btn.className = 'cat-pill';
  btn.innerHTML = `<span class="pip" style="background:${color}"></span>${label}`;
  btn.onclick = () => {
    if (!catId) { window.scrollTo({top:0,behavior:'smooth'}); return; }
    const el = document.getElementById('cat-'+catId);
    if (el) {
      if (!openSet.has(catId)) { openSet.add(catId); el.classList.add('open'); }
      setTimeout(() => el.scrollIntoView({behavior:'smooth', block:'start'}), 50);
    }
  };
  return btn;
}

function makeDivider() {
  const d = document.createElement('div');
  d.className = 'toolbar-divider';
  return d;
}

/* ── Expand/collapse ────────────────────────────────────── */
function toggleAll() {
  allOpen = !allOpen;
  if (allOpen) {
    openSet.add('articles'); CATEGORIES.forEach(c => openSet.add(c.id));
    openSet.add('vendor');
    document.querySelectorAll('.cat-section').forEach(s => s.classList.add('open'));
    document.getElementById('expand-btn').textContent = '− collapse all';
  } else {
    openSet.clear(); openSet.add('articles');
    document.querySelectorAll('.cat-section').forEach(s => s.classList.toggle('open', s.id === 'cat-articles'));
    document.getElementById('expand-btn').textContent = '+ expand all';
  }
}

/* ── Load feeds ─────────────────────────────────────────── */
async function loadFeeds() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('cats').innerHTML = '';
  document.getElementById('last-updated').textContent = 'syncing…';
  try {
    const res = await fetch('feeds.json?_='+Date.now());
    if (!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    allFeeds = data.feeds || [];

    const total = allFeeds.reduce((a,f) => a+(f.items?.length||0), 0);
    const ok    = allFeeds.filter(f => !f.error).length;
    document.getElementById('stat-total').textContent   = total;
    document.getElementById('stat-sources').textContent = `${ok}/${allFeeds.length}`;

    if (data.generatedAt) {
      const d   = new Date(data.generatedAt);
      const fmt = d.toLocaleString('en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
      document.getElementById('stat-updated').textContent = fmt;
      document.getElementById('last-updated').innerHTML  = `synced <b>${fmt}</b>`;
      document.getElementById('footer-ts').textContent   = `last fetch: ${fmt}`;
    } else {
      document.getElementById('last-updated').innerHTML =
        `<span style="color:var(--ms-yellow)">⚠ no data — run the github action</span>`;
      document.getElementById('stat-updated').textContent = 'never';
    }

    buildToolbar();
    renderAll('');
  } catch(err) {
    document.getElementById('loading').innerHTML = `
      <div style="color:var(--ms-red);font-size:22px;margin-bottom:10px">✕</div>
      <div style="font-weight:600">Failed to load feeds</div>
      <div style="font-size:12px;color:var(--text-mute);margin-top:4px;font-family:monospace">${esc(err.message)}</div>`;
  }
}

/* ── Render ─────────────────────────────────────────────── */
function renderAll(query) {
  document.getElementById('loading').style.display = 'none';
  const container = document.getElementById('cats');
  container.innerHTML = '';
  const now = Date.now();
  const threshold = newDays * 24 * 60 * 60 * 1000;
  let delay = 0;

  function withinWindow(item) {
    const pub = item.pubDate ? new Date(item.pubDate) : null;
    return pub && (now - pub.getTime()) < threshold;
  }
  function matchesQuery(item) {
    return !query || (item.title + ' ' + (item.summary||'')).toLowerCase().includes(query);
  }

  // Official (vendor) section — rendered first
  const vendorFeeds = allFeeds.filter(f => f.vendor);
  const vendorItems = vendorFeeds.flatMap(f =>
    (f.items||[]).filter(i => withinWindow(i) && matchesQuery(i))
  );
  if (vendorItems.length || !query) {
    container.appendChild(buildVendorSection(vendorFeeds, delay, query));
    delay += 45;
  }

  // Articles — flat card grid, filtered to newDays window (excludes vendor feeds)
  const articleItems = [];
  for (const feed of allFeeds) {
    if (feed.type !== 'rss' || feed.vendor) continue;
    for (const item of (feed.items || [])) {
      if (withinWindow(item) && matchesQuery(item))
        articleItems.push({ ...item, _feedLabel: feed.label, _feedMvp: !!feed.mvp });
    }
  }
  articleItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
  if (articleItems.length || !query) {
    container.appendChild(buildBlogPostsSection(articleItems, delay, query));
    delay += 45;
  }

  // Audio and Video — per-source cards, filtered to newDays window
  for (const cat of CATEGORIES) {
    const feeds = allFeeds
      .filter(f => f.type === cat.id && !f.vendor)
      .map(f => ({ ...f, items: (f.items||[]).filter(i => withinWindow(i) && matchesQuery(i)) }))
      .filter(f => f.items.length > 0);
    if (!feeds.length) continue;
    container.appendChild(buildCatSection(cat, feeds, delay, query));
    delay += 45;
  }

  document.getElementById('stat-total').textContent = allFeeds.reduce((a,f) => a+(f.items?.length||0), 0);
}

/* ── Blog Posts section — flat individual article cards ──── */
function buildBlogPostsSection(items, delay, query) {
  const isOpen = openSet.has('articles') || !!query;
  const sec = document.createElement('div');
  sec.className = 'cat-section' + (isOpen ? ' open' : '');
  sec.id = 'cat-articles';

  const hdr = document.createElement('div');
  hdr.className = 'cat-header';
  hdr.innerHTML = `
    <div class="cat-color-bar" style="background:${ARTICLES_CAT.color}"></div>
    <div class="cat-header-inner">
      <div class="cat-name">${ARTICLES_CAT.label}</div>
      <div class="cat-meta">
        <span class="cat-pill-count">${items.length} item${items.length!==1?'s':''}</span>
      </div>
      <span class="cat-chevron">▶</span>
    </div>`;
  hdr.onclick = () => {
    const was = sec.classList.contains('open');
    sec.classList.toggle('open', !was);
    was ? openSet.delete('articles') : openSet.add('articles');
  };

  const body = document.createElement('div');
  body.className = 'cat-body';

  const grid = document.createElement('div');
  grid.className = 'new-card-grid';

  items.forEach((item, i) => {
    const pub = item.pubDate ? new Date(item.pubDate) : null;
    const ds = pub ? pub.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '';
    const tags = (item.categories||[]).slice(0,4).map(t=>`<span class="art-tag">${esc(t)}</span>`).join('');
    const title = query ? hi(item.title, query) : esc(item.title);
    const rawSumm = item.summary || '';
    const summ = rawSumm ? (query ? hi(rawSumm.slice(0,220), query) : esc(rawSumm.slice(0,220))) : '';

    const card = document.createElement('a');
    card.className = 'new-card';
    card.href = item.link; card.target = '_blank'; card.rel = 'noopener noreferrer';
    card.style.animationDelay = (Math.min(i, 30) * 20) + 'ms';

    const topBg = tintBg(ARTICLES_CAT.color, 0.07);
    card.innerHTML = `
      <div class="new-card-top" style="background:${topBg}">
        <span class="new-card-source">${esc(item._feedLabel)}</span>
        ${item._feedMvp ? '<span class="mvp-badge">MVP</span>' : ''}
        ${ds ? `<span class="new-card-date">${ds}</span>` : ''}
      </div>
      <div class="new-card-body">
        <div class="new-card-title">${title}</div>
        ${summ ? `<div class="new-card-summary">${summ}${rawSumm.length>220?'…':''}</div>` : ''}
        ${tags ? `<div class="art-tags">${tags}</div>` : ''}
      </div>`;

    grid.appendChild(card);
  });

  body.appendChild(grid);
  sec.appendChild(hdr);
  sec.appendChild(body);
  return sec;
}

/* ── Color tint helper ──────────────────────────────────── */
function tintBg(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ── Video / Audio sections — flat card grid ────────────── */
function buildCatSection(cat, feeds, delay, query) {
  const isOpen = openSet.has(cat.id) || !!query;

  // Collect + sort all items across feeds
  const allItems = [];
  feeds.forEach(feed => {
    (feed.items || []).forEach(item => allItems.push({ ...item, _feedLabel: feed.label, _sectionColor: cat.color, _feedMvp: !!feed.mvp }));
  });
  allItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

  const sec = document.createElement('div');
  sec.className = 'cat-section' + (isOpen ? ' open' : '');
  sec.id = 'cat-'+cat.id;

  const hdr = document.createElement('div');
  hdr.className = 'cat-header';
  hdr.innerHTML = `
    <div class="cat-color-bar" style="background:${cat.color}"></div>
    <div class="cat-header-inner">
      <div class="cat-name">${esc(cat.label)}</div>
      <div class="cat-meta">
        <span class="cat-pill-count">${allItems.length} item${allItems.length!==1?'s':''}</span>
      </div>
      <span class="cat-chevron">▶</span>
    </div>`;
  hdr.onclick = () => {
    const was = sec.classList.contains('open');
    sec.classList.toggle('open', !was);
    was ? openSet.delete(cat.id) : openSet.add(cat.id);
  };

  const body = document.createElement('div');
  body.className = 'cat-body';
  const grid = document.createElement('div');
  grid.className = 'new-card-grid';

  allItems.forEach((item, i) => {
    const cardDelay = (Math.min(i, 30) * 20) + 'ms';
    grid.appendChild(cat.id === 'video' ? buildVideoCard(item, cardDelay) : buildAudioCard(item, cardDelay));
  });

  body.appendChild(grid);
  sec.appendChild(hdr);
  sec.appendChild(body);
  return sec;
}

/* ── Official section — flat grid with per-vendor color labels ── */
function buildVendorSection(vendorFeeds, delay, query) {
  const isOpen = openSet.has('vendor') || !!query;

  // Build a lookup from vendor id → vendor config
  const vendorMap = Object.fromEntries(VENDORS.map(v => [v.id, v]));

  // Collect all items, attaching vendor info
  const allItems = [];
  for (const feed of vendorFeeds) {
    const vendor = vendorMap[feed.vendor] || { id: feed.vendor, label: feed.vendor, color: '#888' };
    for (const item of (feed.items || [])) {
      allItems.push({ ...item, _feedLabel: feed.label, _feedMvp: !!feed.mvp, _vendor: vendor });
    }
  }
  allItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

  const sec = document.createElement('div');
  sec.className = 'cat-section' + (isOpen ? ' open' : '');
  sec.id = 'cat-vendor';

  // Build vendor color-bar as a multi-segment stripe
  const stripeSegs = VENDORS
    .filter(v => vendorFeeds.some(f => f.vendor === v.id))
    .map(v => `<div style="flex:1;background:${v.color}"></div>`)
    .join('');
  const colorBar = `<div style="width:4px;flex-shrink:0;display:flex;flex-direction:column">${stripeSegs}</div>`;

  const hdr = document.createElement('div');
  hdr.className = 'cat-header';
  hdr.innerHTML = `
    ${colorBar}
    <div class="cat-header-inner">
      <div class="cat-name">${esc(VENDOR_CAT.label)}</div>
      <div class="cat-meta">
        ${VENDORS.filter(v => vendorFeeds.some(f => f.vendor === v.id)).map(v =>
          `<span class="vendor-badge" style="color:${v.color};border-color:${v.color}40;background:${v.color}18">${esc(v.label)}</span>`
        ).join('')}
        <span class="cat-pill-count">${allItems.length} item${allItems.length!==1?'s':''}</span>
      </div>
      <span class="cat-chevron">▶</span>
    </div>`;
  hdr.onclick = () => {
    const was = sec.classList.contains('open');
    sec.classList.toggle('open', !was);
    was ? openSet.delete('vendor') : openSet.add('vendor');
  };

  const body = document.createElement('div');
  body.className = 'cat-body';
  const grid = document.createElement('div');
  grid.className = 'new-card-grid';

  allItems.forEach((item, i) => {
    const vendor = item._vendor;
    const pub = item.pubDate ? new Date(item.pubDate) : null;
    const ds = pub ? pub.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '';
    const tags = (item.categories||[]).slice(0,4).map(t=>`<span class="art-tag">${esc(t)}</span>`).join('');
    const title = query ? hi(item.title, query) : esc(item.title);
    const rawSumm = item.summary || '';
    const summ = rawSumm ? (query ? hi(rawSumm.slice(0,220), query) : esc(rawSumm.slice(0,220))) : '';

    const card = document.createElement('a');
    card.className = 'new-card';
    card.href = item.link; card.target = '_blank'; card.rel = 'noopener noreferrer';
    card.style.animationDelay = (Math.min(i, 30) * 20) + 'ms';

    const topBg = tintBg(vendor.color, 0.07);
    card.innerHTML = `
      <div class="new-card-top" style="background:${topBg}">
        <span class="vendor-badge" style="color:${vendor.color};border-color:${vendor.color}40;background:${vendor.color}18">${esc(vendor.label)}</span>
        <span class="new-card-source">${esc(item._feedLabel)}</span>
        ${item._feedMvp ? '<span class="mvp-badge">MVP</span>' : ''}
        ${ds ? `<span class="new-card-date">${ds}</span>` : ''}
      </div>
      <div class="new-card-body">
        <div class="new-card-title">${title}</div>
        ${summ ? `<div class="new-card-summary">${summ}${rawSumm.length>220?'…':''}</div>` : ''}
        ${tags ? `<div class="art-tags">${tags}</div>` : ''}
      </div>`;

    grid.appendChild(card);
  });

  body.appendChild(grid);
  sec.appendChild(hdr);
  sec.appendChild(body);
  return sec;
}

/* ── Video card (individual item) ───────────────────────── */
function buildVideoCard(item, delay) {
  const card = document.createElement('a');
  card.className = 'new-card';
  card.href = item.link; card.target = '_blank'; card.rel = 'noopener noreferrer';
  card.style.animationDelay = delay;

  const pub = item.pubDate ? new Date(item.pubDate) : null;
  const ds = pub ? pub.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '';
  const thumb = item.thumbnail || (item.videoId ? `https://i.ytimg.com/vi/${item.videoId}/mqdefault.jpg` : '');
  const topBg = item._sectionColor ? tintBg(item._sectionColor, 0.07) : 'transparent';

  card.innerHTML = `
    <div class="new-card-top" style="background:${topBg}">
      <span class="new-card-source">${esc(item._feedLabel || '')}</span>
      ${item._feedMvp ? '<span class="mvp-badge">MVP</span>' : ''}
      ${ds ? `<span class="new-card-date">${ds}</span>` : ''}
    </div>
    ${thumb ? `<img class="new-card-thumb" src="${esc(thumb)}" alt="" loading="lazy" />` : ''}
    <div class="new-card-body">
      <div class="new-card-title">${esc(item.title)}</div>
    </div>`;

  return card;
}

/* ── Audio card (individual item) ───────────────────────── */
function buildAudioCard(item, delay) {
  const card = document.createElement('div');
  card.className = 'new-card';
  card.style.animationDelay = delay;

  const pub = item.pubDate ? new Date(item.pubDate) : null;
  const ds = pub ? pub.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '';
  const topBg = item._sectionColor ? tintBg(item._sectionColor, 0.07) : 'transparent';

  card.innerHTML = `
    <div class="new-card-top" style="background:${topBg}">
      <span class="new-card-source">${esc(item._feedLabel || '')}</span>
      ${item._feedMvp ? '<span class="mvp-badge">MVP</span>' : ''}
      ${ds ? `<span class="new-card-date">${ds}</span>` : ''}
    </div>
    <div class="new-card-body">
      <a class="new-card-title" href="${esc(item.link)}" target="_blank" rel="noopener noreferrer"
         style="color:inherit;text-decoration:none">${esc(item.title)}</a>
      ${item.duration ? `<div style="font-size:12px;color:var(--text-mute);margin-top:2px">⏱ ${esc(item.duration)}</div>` : ''}
      ${item.audioUrl
        ? `<audio controls preload="none" src="${esc(item.audioUrl)}" style="width:100%;margin-top:8px"></audio>`
        : `<a href="${esc(item.link)}" target="_blank" rel="noopener noreferrer"
             style="color:var(--accent);font-size:13px;margin-top:6px;display:inline-block">→ open episode</a>`}
    </div>`;

  return card;
}

/* ── Sources view ───────────────────────────────────────── */
let sourcesOpen = false;

function showSources() {
  sourcesOpen = !sourcesOpen;
  document.getElementById('sources-view').style.display = sourcesOpen ? 'block' : 'none';
  document.getElementById('cats').style.display        = sourcesOpen ? 'none' : 'contents';
  document.getElementById('sources-btn').classList.toggle('active', sourcesOpen);
  document.getElementById('expand-btn').style.display  = sourcesOpen ? 'none' : '';
  if (sourcesOpen) buildSourcesView();
}

function buildSourcesView() {
  const view = document.getElementById('sources-view');
  view.innerHTML = '';

  const groups = [
    { label: 'Blog Posts', type: 'rss',   color: ARTICLES_CAT.color, excludeVendor: true },
    { label: 'Video',      type: 'video',  color: '#f25022' },
    { label: 'Podcasts',   type: 'audio',  color: '#00a4ef' },
  ];

  groups.forEach(group => {
    const feeds = allFeeds.filter(f => f.type === group.type && (!group.excludeVendor || !f.vendor));
    if (!feeds.length) return;

    const heading = document.createElement('div');
    heading.className = 'sources-heading';
    heading.innerHTML = `<span class="sources-heading-dot" style="background:${group.color}"></span>${esc(group.label)} <span style="font-weight:400;opacity:0.6">(${feeds.length})</span>`;
    view.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'new-card-grid';

    feeds.forEach(feed => {
      let siteUrl = '';
      try {
        if (feed.items && feed.items.length && feed.items[0].link) {
          const u = new URL(feed.items[0].link);
          siteUrl = u.origin;
        } else {
          siteUrl = new URL(feed.url).origin;
        }
      } catch(_) { siteUrl = feed.url; }

      const card = document.createElement('a');
      card.className = 'new-card';
      card.href = siteUrl;
      card.target = '_blank'; card.rel = 'noopener noreferrer';
      card.style.animationDelay = '0ms';

      const topBg = tintBg(group.color, 0.07);
      card.innerHTML = `
        <div class="new-card-top" style="background:${topBg}">
          <span class="new-card-source">${esc(feed.label)}</span>
          ${feed.error ? `<span style="font-size:10px;color:var(--ms-red);font-weight:600">ERR</span>` : `<span style="font-size:11px;color:var(--text-mute)">${feed.items?.length||0} items</span>`}
        </div>
        <div class="new-card-body">
          <div style="font-size:12px;color:var(--text-mute);word-break:break-all">${esc(siteUrl)}</div>
        </div>`;

      grid.appendChild(card);
    });

    view.appendChild(grid);
  });

  // Vendor groups
  VENDORS.forEach(vendor => {
    const feeds = allFeeds.filter(f => f.vendor === vendor.id);
    if (!feeds.length) return;

    const heading = document.createElement('div');
    heading.className = 'sources-heading';
    heading.innerHTML = `<span class="sources-heading-dot" style="background:${vendor.color}"></span>${esc('Vendor — ' + vendor.label)} <span style="font-weight:400;opacity:0.6">(${feeds.length})</span>`;
    view.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'new-card-grid';

    feeds.forEach(feed => {
      let siteUrl = '';
      try {
        if (feed.items && feed.items.length && feed.items[0].link) {
          const u = new URL(feed.items[0].link);
          siteUrl = u.origin;
        } else {
          siteUrl = new URL(feed.url).origin;
        }
      } catch(_) { siteUrl = feed.url; }

      const card = document.createElement('a');
      card.className = 'new-card';
      card.href = siteUrl;
      card.target = '_blank'; card.rel = 'noopener noreferrer';
      card.style.animationDelay = '0ms';

      const topBg = tintBg(vendor.color, 0.07);
      card.innerHTML = `
        <div class="new-card-top" style="background:${topBg}">
          <span class="new-card-source">${esc(feed.label)}</span>
          ${feed.error ? `<span style="font-size:10px;color:var(--ms-red);font-weight:600">ERR</span>` : `<span style="font-size:11px;color:var(--text-mute)">${feed.items?.length||0} items</span>`}
        </div>
        <div class="new-card-body">
          <div style="font-size:12px;color:var(--text-mute);word-break:break-all">${esc(siteUrl)}</div>
        </div>`;

      grid.appendChild(card);
    });

    view.appendChild(grid);
  });
}

/* ── Search ─────────────────────────────────────────────── */
let searchTimer;
function handleSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() =>
    renderAll(document.getElementById('search').value.toLowerCase().trim()), 160);
}

/* ── Helpers ────────────────────────────────────────────── */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function hi(text, q) {
  return esc(text).replace(
    new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),
    '<mark style="background:rgba(255,185,0,0.25);color:var(--ms-yellow);border-radius:1px;padding:0 1px">$1</mark>'
  );
}

/* ── Boot ───────────────────────────────────────────────── */
loadFeeds();
</script>
